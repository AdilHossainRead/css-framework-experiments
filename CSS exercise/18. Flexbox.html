<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        .parentDiv{
        background-color: lightgray;
        width: 80%;
        height: 300px;
        margin: auto;
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        }
        .childDiv{
        background-color: lightblue;
        border: double black 4px;
        border-radius: 20px;
        width: 30%;
        height: 30%;
        align-self: center;
        }
    </style>
</head>

<body>
    <div class="parentDiv">
        <div class="childDiv">this is div 1</div>
        <div class="childDiv">this is div 2</div>
        <div class="childDiv">this is div 3</div>
        <div class="childDiv">this is div 4</div>
        <div class="childDiv">this is div 5</div>
        <div class="childDiv">this is div 6</div>
    </div>
</body>

</html>
